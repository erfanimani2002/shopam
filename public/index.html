<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شاپام</title>
<meta name="theme-color" content="#4f46e5">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="wrap">
  <div class="topbar">
    <h1 class="brand">شاپام</h1>
    <button class="theme-btn" id="btn-theme">حالت نمایش</button>
  </div>

  <section id="login-card" class="card hidden">
    <h2>ورود به فروشگاه</h2>
    <label for="f-slug">شناسه فروشگاه</label>
    <input id="f-slug" dir="ltr" autocomplete="off" placeholder="my-shop">
    <label for="f-ident">ایمیل یا شماره موبایل</label>
    <input id="f-ident" dir="ltr" autocomplete="username">
    <label for="f-pass">رمز عبور</label>
    <input id="f-pass" type="password" dir="ltr" autocomplete="current-password">
    <button class="btn primary" id="btn-login">ورود</button>
    <p class="error hidden" id="login-error"></p>
    <a class="linkrow small" href="admin.html">ورود مدیر سامانه</a>
  </section>

  <section id="shell" class="hidden">
    <div class="shellbar card">
      <div class="shellrow">
        <strong id="shop-name"></strong>
        <button class="mini" id="btn-logout">خروج</button>
      </div>
      <p class="error hidden" id="sub-warning"></p>
      <nav class="tabs">
        <button class="tab active" disabled>محصولات</button>
        <button class="tab" disabled title="به‌زودی">سفارشات</button>
        <button class="tab" disabled title="به‌زودی">گزارش‌ها</button>
        <button class="tab" disabled title="به‌زودی">تنظیمات</button>
      </nav>
    </div>

    <section id="products-screen">
      <div class="card">
        <div class="filters">
          <input id="f-search" placeholder="جستجوی نام، بارکد یا برند…" autocomplete="off">
          <div class="filterrow">
            <input id="f-category" placeholder="دسته‌بندی" autocomplete="off">
            <select id="f-archived">
              <option value="0">فعال</option>
              <option value="1">بایگانی‌شده</option>
              <option value="all">همه</option>
            </select>
            <select id="f-sort">
              <option value="created">جدیدترین</option>
              <option value="name">نام</option>
              <option value="stock">موجودی</option>
              <option value="sell_price">قیمت فروش</option>
            </select>
          </div>
          <div class="filterrow checks">
            <label class="check"><input type="checkbox" id="f-low-stock"> فقط کم‌موجود</label>
            <label class="check"><input type="checkbox" id="f-expiring"> نزدیک انقضا</label>
          </div>
          <div class="filterrow">
            <button class="btn primary" id="btn-add-product">افزودن محصول</button>
            <button class="btn" id="btn-bulk-price" disabled>تغییر گروهی قیمت</button>
          </div>
          <div class="muted small" id="products-count"></div>
        </div>
      </div>

      <div id="products-grid" class="grid"></div>
      <div id="products-pager" class="pager"></div>
    </section>
  </section>
</main>

<!-- Add/Edit product dialog (form generated from the field schema) -->
<div id="product-dialog" class="dialog hidden">
  <div class="dialog-card">
    <div class="dlg-head">
      <h2 id="dlg-title">محصول جدید</h2>
      <button class="mini" id="btn-dlg-close">بستن</button>
    </div>
    <form id="dlg-form" onsubmit="return false;"></form>
    <p class="error hidden" id="dlg-error"></p>
    <div id="dlg-images"></div>
    <button class="btn primary" id="btn-product-save">ذخیره</button>
  </div>
</div>

<!-- Bulk price dialog -->
<div id="bulk-dialog" class="dialog hidden">
  <div class="dialog-card">
    <div class="dlg-head">
      <h2>تغییر گروهی قیمت</h2>
      <button class="mini" id="btn-bp-cancel">بستن</button>
    </div>
    <p class="muted small" id="bp-count"></p>
    <label for="bp-mode">حالت</label>
    <select id="bp-mode">
      <option value="percent">درصد (٪)</option>
      <option value="fixed">مقدار ثابت (تومان)</option>
    </select>
    <label for="bp-value">مقدار (می‌تواند منفی باشد)</label>
    <input id="bp-value" dir="ltr" autocomplete="off">
    <div id="bp-include-buy" class="hidden">
      <label class="check"><input type="checkbox" id="bp-include-buy-input"> قیمت خرید هم تغییر کند</label>
    </div>
    <label>پیش‌نمایش (۵ مورد اول)</label>
    <div id="bp-preview" class="preview"></div>
    <p class="error hidden" id="bp-error"></p>
    <button class="btn primary" id="btn-bp-apply">اعمال</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="js/format.js"></script>
<script src="js/jalali.js"></script>
<script src="js/app.js"></script>
<script src="js/product-form.js"></script>
<script src="js/products.js"></script>
<script src="js/product-dialog.js"></script>
<script src="js/product-images.js"></script>
<script src="js/bulk-price.js"></script>
<script>
'use strict';
/* Login flow (kept from step 2, now feeding the shell). */
(function () {
  var $ = function (id) { return document.getElementById(id); };

  APP.boot();

  $('btn-login').addEventListener('click', function () {
    var err = $('login-error');
    err.classList.add('hidden');
    APP.get('csrf').then(function (csrf) {
      if (!csrf.ok) { APP.showError('login-error', csrf); return; }
      APP.post('login', {
        slug: $('f-slug').value.trim().toLowerCase(),
        identifier: $('f-ident').value.trim(),
        password: $('f-pass').value
      }).then(function (j) {
        if (j.ok) APP.initShell(j.data);
        else APP.showError('login-error', j);
      });
    });
  });

  $('btn-dlg-close').addEventListener('click', ProductDialog.close);
  $('btn-product-save').addEventListener('click', ProductDialog.save);
  BulkPrice.init();
})();
</script>
</body>
</html>
